name: Pay.UK
kind: company
description: >-
  Pay.UK Limited is the recognised operator and standards body for the United
  Kingdom's interbank retail payment systems. It runs the domestic rails that
  move most of the money in the UK economy: Bacs (batch Direct Debit and Direct
  Credit), the Faster Payment System (24/7 real-time account-to-account
  payments), and the Image Clearing System for cheques, alongside the Current
  Account Switch Service. On top of the rails it owns industry overlay services
  including Confirmation of Payee (the API-based account name-checking service
  that fights Authorised Push Payment fraud) and Request to Pay, and through its
  Standards Authority it defines UK payments standards and the ISO 20022 migration
  underpinning the New Payments Architecture. Pay.UK is a scheme and standards
  operator, not a self-serve API platform: it publishes rulebooks, participation
  requirements, and ISO 20022 message specifications rather than an open public
  API, and its technical standards are distributed through the gated Standards
  Source and Faster Payment System Standards Library portals (single-login,
  registration required). Confirmation of Payee is a documented, API-based
  peer-to-peer scheme that participants and approved vendors implement against
  Pay.UK's technical standards. Home market is the United Kingdom.
